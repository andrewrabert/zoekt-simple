name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate upstream overlay
        run: go run ./internal/upstream/generate.go

      - name: Test
        run: go test -overlay=overlay.json -vet=off ./internal/... ./cmd/...
